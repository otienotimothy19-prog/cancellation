{% load ui %}
<div class="empty{% if compact %} empty--compact{% endif %}">
  <div class="empty__icon">{% icon icon|default:"inbox" 22 %}</div>
  <strong>{{ title }}</strong>
  {% if text %}<div>{{ text }}</div>{% endif %}
  {% if action_url %}<a class="btn btn-secondary btn-sm" style="margin-top:8px" href="{{ action_url }}">{{ action_label }}</a>{% endif %}
</div>
