<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IMOTH Cancellations{% endblock %}</title>
  <style>
    :root { --ink:#1d2430; --muted:#5b6575; --line:#d9dee6; --bg:#f5f7fa; --card:#fff; --accent:#1f5fbf;
            --ok:#1d7a46; --warn:#a15c00; --bad:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#14233d; color:#fff; padding:10px 20px; display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
    header a { color:#fff; text-decoration:none; } header .brand { font-weight:700; letter-spacing:.02em; }
    header nav { display:flex; gap:16px; flex:1; } header form { margin:0; }
    main { max-width:1150px; margin:0 auto; padding:20px; }
    h1 { font-size:22px; margin:0 0 14px; } h2 { font-size:17px; margin:0 0 10px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; overflow-x:auto; }
    @media (max-width: 640px) { main { padding:12px; } dl.kv { grid-template-columns:1fr; } }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
    table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; font-size:13px; }
    a { color:var(--accent); }
    .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; background:#e8ecf2; }
    .s-DRAFT{background:#e8ecf2} .s-SENT{background:#dbe8fb;color:#123f80} .s-CONFIRMED{background:#d7f0e1;color:var(--ok)}
    .s-REJECTED{background:#fbe0dd;color:var(--bad)} .s-QUERY{background:#fdeccf;color:var(--warn)} .s-CLOSED{background:#ddd}
    .stale{background:#fbe0dd;color:var(--bad)}
    .messages { list-style:none; padding:0; margin:0 0 14px; } .messages li { padding:9px 12px; border-radius:6px; margin-bottom:6px; }
    .messages .success{background:#d7f0e1} .messages .error{background:#fbe0dd} .messages .info,.messages .warning{background:#fdeccf}
    label { display:block; font-weight:600; font-size:13px; margin:8px 0 3px; }
    input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], select, textarea {
      width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
    ul.errorlist { color:var(--bad); margin:3px 0; padding-left:18px; font-size:13px; }
    .btn { display:inline-block; padding:7px 14px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff;
           font:inherit; cursor:pointer; text-decoration:none; } .btn.secondary { background:#fff; color:var(--accent); }
    .btn.danger { background:var(--bad); border-color:var(--bad); } .btn:disabled { opacity:.45; cursor:not-allowed; }
    .muted { color:var(--muted); font-size:13px; } pre.mail { white-space:pre-wrap; background:#f8f9fb; border:1px solid var(--line); padding:10px; border-radius:6px; font-size:13px; max-height:360px; overflow:auto; }
    .warnbox { border-left:4px solid var(--warn); background:#fff8eb; padding:10px 12px; border-radius:4px; margin-bottom:10px; }
    .badbox { border-left:4px solid var(--bad); background:#fff1ef; padding:10px 12px; border-radius:4px; margin-bottom:10px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; } .row > * { flex:1; min-width:160px; }
    .radio-list ul { list-style:none; padding:0; margin:4px 0; } .radio-list label { font-weight:400; display:inline; }
    dl.kv { display:grid; grid-template-columns:170px 1fr; gap:4px 10px; margin:0; } dl.kv dt { color:var(--muted); } dl.kv dd { margin:0; }
  </style>
</head>
<body>
<header>
  <a class="brand" href="{% url 'cancellations:case_list' %}">IMOTH Cancellations</a>
  {% if user.is_authenticated %}
  <nav>
    <a href="{% url 'cancellations:case_list' %}">Cases</a>
    <a href="{% url 'cancellations:case_create' %}">New cancellation</a>
    <a href="{% url 'cancellations:unmatched_list' %}">Unmatched inbox</a>
  </nav>
  <span class="muted" style="color:#c8d2e3">{{ user.get_username }}</span>
  <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn secondary" style="padding:3px 10px">Log out</button></form>
  {% endif %}
</header>
<main>
  {% if messages %}<ul class="messages">{% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
  {% block content %}{% endblock %}
</main>
<script>
  // Confirmation prompts for irreversible actions (text comes from data attributes, never inline JS).
  document.querySelectorAll("form[data-confirm]").forEach(f => f.addEventListener("submit", e => {
    if (!confirm(f.dataset.confirm)) e.preventDefault();
  }));
  document.querySelectorAll("[data-confirm-click]").forEach(b => b.addEventListener("click", e => {
    if (!confirm(b.dataset.confirmClick)) e.preventDefault();
  }));
</script>
{% block scripts %}{% endblock %}
</body>
</html>
